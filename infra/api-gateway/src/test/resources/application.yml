spring:
  cloud:
    config:
      enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - OPTIONS
            allowed-headers:
              - '*'
            allow-credentials: true

eureka:
  client:
    enabled: false

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER

      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN
