spring:
  main:
    banner-mode: off
    log-startup-info: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

app:
  http:
    request-id-header: "X-Request-Id"

logging:
  level:
    ru.yandex.practicum.telemetry: INFO
    org:
      springframework: WARN
      apache.kafka: WARN

kafka:
  bootstrap-servers: "localhost:9092"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/